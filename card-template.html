<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Catalogue</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ground: #fafaf9; --card: #f2f2f0; --ink: #2a2a2e; --muted: #8a8a90; --line: #e2e2df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --ground: #08090a; --card: #111214; --ink: #d0d6e0; --muted: #6f717a; --line: #222326; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --card: #111214; --ink: #d0d6e0; --muted: #6f717a; --line: #222326; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: var(--ground); color: var(--ink);
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 520px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  /* the figure's plates take the card's colour, so the drawing sits on it the way the reference does */
  #stage { --hairline-plate: var(--card); }
  .corner { position: absolute; z-index: 1; pointer-events: none; text-transform: uppercase; font-size: 10px; color: var(--muted); }
  .tl { top: 14px; left: 16px; text-transform: none; }
  .tr { top: 14px; right: 16px; }
  .bl { bottom: 14px; left: 16px; }
  .br { bottom: 14px; right: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bl i { font-style: normal; display: inline-block; margin-left: 6px; letter-spacing: 0.3em; }
  .control { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 0 2px; }
  .control label { color: var(--muted); white-space: nowrap; }
  .control output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    flex: 1; min-width: 0; height: 28px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, .theme:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  body, .card { transition: background-color 300ms cubic-bezier(.32,.72,0,1), border-color 300ms cubic-bezier(.32,.72,0,1), color 300ms cubic-bezier(.32,.72,0,1); }
  /* the theme switch: a small pill whose dot is half moon, half sun, and turns over when pressed */
  .theme {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 9px;
    border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink);
    font: inherit; letter-spacing: inherit; cursor: pointer;
    transition: border-color 200ms cubic-bezier(.32,.72,0,1), transform 120ms cubic-bezier(.32,.72,0,1);
  }
  .theme:hover { border-color: var(--muted); }
  .theme:active { transform: scale(0.96); }
  .theme .dot {
    width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink);
    background: linear-gradient(90deg, var(--ink) 50%, transparent 50%);
    transition: transform 500ms cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="dark"] .theme .dot { transform: rotate(180deg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme .dot { transform: rotate(180deg); } }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  @media (prefers-reduced-motion: reduce) { body, .card, .theme, .theme .dot { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="corner tl">Fig 0.1</span>
    <span class="corner tr">Card catalogue</span>
    <div id="stage"></div>
    <span class="corner bl">Hover a drawer<i>· ·</i></span>
    <span class="corner br" id="read">Rest</span>
  </div>
  <div class="control">
    <label for="intensity">card lift</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <button class="theme" id="theme" type="button" aria-label="Switch between the light and the dark theme"><span class="dot"></span><span id="themeName"></span></button>
  </div>
</main>
<script>
/*KERNEL*/
</script>
<script>
/* The host: mounts one Hairline figure into the card, the way the package's own mount does. */
window.hairline = (figure) => {
  const $ = (id) => document.getElementById(id), stage = $("stage"), slider = $("intensity");
  const [lo, mid, hi] = figure.range;
  const at = (i) => Math.round((i <= 0.5 ? lo + (i / 0.5) * (mid - lo) : mid + ((i - 0.5) / 0.5) * (hi - mid)) * 1000) / 1000;
  HL.inject(document);
  stage.setAttribute("data-hairline", figure.name);
  stage.setAttribute("role", "img");
  stage.setAttribute("aria-label", figure.means);
  const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);
  const read = { set textContent(v) { $("read").textContent = String(v); } };
  const show = () => { $("value").textContent = String(at(Number(slider.value))); };
  show();
  const handle = figure.mount({ stage, svg, read }, at(Number(slider.value)));
  slider.addEventListener("input", () => { show(); handle.set(at(Number(slider.value))); });
};
</script>
<script>
/* The theme switch: the system's theme until pressed, then the visitor's, remembered. A circle of the new theme
   grows out from the switch; with reduced motion, or without view transitions, it simply changes. */
(() => {
  const root = document.documentElement, btn = document.getElementById("theme"), name = document.getElementById("themeName");
  const sys = matchMedia("(prefers-color-scheme: dark)"), still = matchMedia("(prefers-reduced-motion: reduce)");
  const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : sys.matches);
  const label = () => { name.textContent = isDark() ? "dark" : "light"; };
  try { const saved = localStorage.getItem("catalogue-theme"); if (saved === "light" || saved === "dark") root.dataset.theme = saved; } catch {}
  label();
  sys.addEventListener("change", label);
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    const apply = () => { root.dataset.theme = next; label(); try { localStorage.setItem("catalogue-theme", next); } catch {} };
    if (!document.startViewTransition || still.matches) { apply(); return; }
    const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => {
      root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 650, easing: "cubic-bezier(.32,.72,0,1)", pseudoElement: "::view-transition-new(root)" });
    });
  });
})();
</script>

</body>
</html>
